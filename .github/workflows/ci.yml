# =============================================================================
#  GitHub Actions: har bir push va pull request'da yadroni yig'ib, testlarni
#  ishga tushiradi. Testlar yiqilsa - GitHub'da qizil belgi chiqadi.
# =============================================================================
name: build-and-test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Vositalarni o'rnatish
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm qemu-system-x86 \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools ovmf e2fsprogs python3

      - name: Yig'ish (ogohlantirishlar = xato)
        run: make -j"$(nproc)"

      - name: Laboratoriyalar - stub'lar kompilyatsiya bo'ladi, libc host testi
        run: make lab-check

      - name: Testlar - BIOS va UEFI (yadro selftest + shell orqali integratsion testlar)
        # printf/kprintf/malloc - darslikdagi doimiy mashqlar (M1-M4, darslik/32-printf-malloc.md): kod repoda
        # bo'sh, vaqtinchalik variant bilan. Ular ochiq turganda integratsion testlar (sonlar, xotira) yiqilishi
        # tabiiy - shuning uchun faqat hammasi yozilgandan keyin ishga tushiriladi. Mashqlarning o'z testi:
        # yuqoridagi lab-check ichidagi tools/myos_mashq.sh.
        run: |
          if grep -q "TODO(M[1-4])" user/libc/printf.c user/libc/malloc.c kernel/lib/kprintf.c; then
            echo "Ochiq mashqlar bor (M1-M4) - integratsion testlar o'tkazib yuborildi"
            tools/myos_mashq.sh --ci
          else
            make test
          fi

      - name: Test logini saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            build/test-output-*.log
            build/test-disk-*.img
